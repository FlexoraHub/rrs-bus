<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRS Smart Bus Attendance</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "9d97433d-8973-40fe-a4b3-8529058d5823",
        safari_web_id: "web.onesignal.auto.3a07767d-f8c5-4ebf-965b-cb322da40f9f",
        serviceWorkerParam: { scope: "/rrs-bus/" },
        serviceWorkerPath: "/rrs-bus/OneSignalSDKWorker.js",
        notifyButton: {
          enable: true
        }
      });

      // Status update check
      const updateStatus = () => {
        const statusEl = document.getElementById("subStatus");
        if (OneSignal.User.PushSubscription.optedIn) {
          statusEl.innerText = "✅ Subscribed! Ready to receive bus alerts.";
          statusEl.style.color = "#188038";
        }
      };

      updateStatus();
      OneSignal.User.PushSubscription.addEventListener("change", updateStatus);

      if (!OneSignal.Notifications.permission) {
        await OneSignal.Notifications.requestPermission();
      }
    });

    function triggerSubscribe() {
      window.OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.Notifications.requestPermission();
        await OneSignal.User.PushSubscription.optIn();
        if (OneSignal.User.PushSubscription.optedIn) {
          const statusEl = document.getElementById("subStatus");
          statusEl.innerText = "✅ Subscribed! Ready to receive bus alerts.";
          statusEl.style.color = "#188038";
        }
      });
    }
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 40px 15px;
      text-align: center;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 30px 22px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    h2 {
      color: #1a73e8;
      margin-top: 0;
    }
    p {
      color: #3c4043;
      line-height: 1.6;
      font-size: 15px;
    }
    .sub-btn {
      display: block;
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin: 18px 0 8px 0;
    }
    #subStatus {
      font-size: 14px;
      font-weight: bold;
      color: #d93025;
      margin-bottom: 14px;
    }
    .note {
      background: #fff8e1;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #5f6368;
      margin: 15px 0;
    }
    .btn {
      display: block;
      background: #188038;
      color: white;
      padding: 14px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🚌 RRS Smart Bus Alerts</h2>
    <p>Daily morning bus attendance notification receive panna, keela irukura button click panni <b>"Allow"</b> kudunga.</p>
    
    <button class="sub-btn" onclick="triggerSubscribe()">🔔 Enable Bus Notifications</button>
    <div id="subStatus">Status: Not Subscribed Yet</div>

    <div class="note">
      <b>iPhone Users:</b> Safari browser-la Share icon tap panni <b>"Add to Home Screen"</b> kuduthutu app-a open panni Allow pannunga.
    </div>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbz7hqrzh_1mtzvwMX6tyEAejuY7E7mB3A0f_OOoI91GG5gpVldJ3Wn0Q0AuP-MTTk7B/exec">
      Mark Today's Attendance
    </a>
  </div>
</body>
</html>
